name: Release

# Push a tag like v0.3.0 (matching tensi/__init__.py and editors/vscode/package.json) to publish
# the Python package to PyPI and the extension to the VS Code Marketplace (and Open VSX if configured).

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: no token stored in the repo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        run: test "v$(python -c 'import tensi; print(tensi.__version__)')" = "${GITHUB_REF_NAME}"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # re-pushing a tag (to finish a failed extension release) keeps the published package

  vscode:
    needs: pypi  # the extension installs tensi from PyPI, so publish that first
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the tag matches the version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run package
      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --no-dependencies --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish *.vsix
      - uses: softprops/action-gh-release@v2
        with:
          files: editors/vscode/*.vsix
          generate_release_notes: true
