[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensi-shapes"
dynamic = ["version"]
description = "Named tensor shapes for unannotated PyTorch: hovers, shape errors and a CLI, built on Pyrefly."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tristan Farran" }]
keywords = ["pytorch", "tensor", "shapes", "type-checking", "pyrefly", "jaxtyping", "einops", "lsp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pyrefly==1.5.0",
  "pyrefly-torch-stubs==1.5.0",
  "pyrefly-einops-stubs==1.5.0",
  "parso>=0.8.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "jaxtyping", "einops"]

[project.urls]
Homepage = "https://github.com/tristan-farran/tensi"
Issues = "https://github.com/tristan-farran/tensi/issues"
Changelog = "https://github.com/tristan-farran/tensi/blob/main/CHANGELOG.md"

[project.scripts]
tensi = "tensi.cli:main"

[tool.setuptools]
packages = ["tensi"]

[tool.setuptools.dynamic]
version = { attr = "tensi.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/fixtures", "tests/golden"]

[tool.ruff.lint]
select = ["E9", "F", "I", "B", "UP"]
ignore = ["B905", "B023", "UP007"]
